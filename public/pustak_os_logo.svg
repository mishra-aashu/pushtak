<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background rounded box -->
  <rect width="512" height="512" rx="128" fill="#0B0F19" />
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="url(#bookGradient)" opacity="0.15" filter="url(#glow)" />
  
  <!-- Stylized Book Pages -->
  <g fill="none" stroke="url(#bookGradient)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Page Curve -->
    <path d="M256,380 C190,320 130,320 70,340 V150 C130,130 190,130 256,190 Z" fill="#0B0F19" />
    <!-- Right Page Curve -->
    <path d="M256,380 C322,320 382,320 442,340 V150 C382,130 322,130 256,190 Z" fill="#0B0F19" />
    <!-- Book Spine line -->
    <path d="M256,190 V395" stroke-width="18" opacity="0.9" />
    <!-- Bookmark hanging -->
    <path d="M256,190 V320 L275,300 L294,320 V205" fill="url(#bookGradient)" stroke="none" />
  </g>
</svg>
